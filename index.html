<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자, 드럼 졸라맨 및 코맹맹이 캐릭터 애니메이션</title>
    <style>
        /* 까만 배경 및 중앙 정렬 */
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* 오디오 작동 안내 문구 */
        .audio-notice {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4d4d;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
        }

        /* 전체 글자 컨테이너 (5초 무한 반복) */
        .text-container {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            display: flex;
            gap: 10px;
        }

        .char {
            opacity: 0;
            animation: fadeInOut 5s infinite;
        }

        .char.space {
            animation: none;
            opacity: 1;
            width: 30px; 
        }

        /* 자막 글자 등장 타이밍 조정 */
        .char:nth-child(1) { animation-delay: 0.0s; } /* 성 */
        .char:nth-child(2) { animation-delay: 0.4s; } /* 욱 */
        .char:nth-child(3) { animation-delay: 0.8s; } /* 아 */
        .char:nth-child(4) { animation-delay: 1.2s; } /* . */
        .char:nth-child(6) { animation-delay: 1.6s; } /* 니 */
        .char:nth-child(7) { animation-delay: 2.0s; } /* 엄 */
        .char:nth-child(8) { animation-delay: 2.4s; } /* 마 */

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            80%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* [왼쪽 아래] 못생긴 점박이 캐릭터 (입 크기가 음성 소리에 맞춰 상호작용) */
        .monster {
            position: absolute;
            left: 40px;
            bottom: 40px;
            width: 120px;
            height: 120px;
            background-color: #7fa99b;
            border-radius: 50%;
            border: 4px solid #555;
            transition: transform 0.1s ease;
        }
        .eye {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .eye::after {
            content: '';
            position: absolute;
            background-color: black;
            border-radius: 50%;
            width: 6px; height: 6px;
            top: 30%; left: 30%;
        }
        .eye.left { width: 24px; height: 28px; top: 25px; left: 25px; }
        .eye.right { width: 18px; height: 20px; top: 28px; left: 65px; }
        .spot { position: absolute; background-color: #5d8276; border-radius: 50%; }
        .spot1 { width: 14px; height: 10px; top: 15px; left: 50px; }
        .spot2 { width: 10px; height: 14px; top: 70px; left: 20px; }
        .spot3 { width: 16px; height: 12px; top: 50px; right: 15px; }
        
        /* 캐릭터의 입 (기본 닫힘 상태, 자바스크립트로 제어) */
        .mouth {
            position: absolute;
            background-color: #551a1a;
            border: 3px solid #333;
            border-radius: 50%;
            left: 35px; top: 60px;
            width: 40px; height: 6px;
            transition: height 0.1s ease, border-radius 0.1s ease;
        }

        /* [오른쪽 위] 졸라맨 + 드럼 컨테이너 */
        .drummer-container {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 150px;
            height: 180px;
            z-index: 5;
        }
        .stickman { position: relative; width: 100%; height: 100%; }
        .head {
            position: absolute;
            width: 30px; height: 30px;
            border: 3px solid white;
            border-radius: 50%;
            left: 60px; top: 20px;
            box-sizing: border-box;
        }
        .body-line { position: absolute; width: 3px; height: 50px; background-color: white; left: 74px; top: 50px; }
        .leg { position: absolute; width: 3px; height: 40px; background-color: white; top: 97px; }
        .leg.left { left: 68px; transform: rotate(15deg); }
        .leg.right { left: 80px; transform: rotate(-15deg); }

        /* 팔 타격 애니메이션 (1초 주기 = 60 BPM) */
        .arm {
            position: absolute;
            width: 3px; height: 35px;
            background-color: white;
            top: 55px;
            transform-origin: top center;
            animation: drumHit 1s infinite ease-in-out;
        }
        .arm.left { left: 74px; transform: rotate(45deg); }
        .arm.right { left: 74px; transform: rotate(-45deg); animation-delay: 0.5s; }

        .drum {
            position: absolute;
            width: 60px; height: 35px;
            background-color: #333;
            border: 3px solid white;
            border-radius: 4px;
            left: 45px; top: 85px;
            box-sizing: border-box;
        }
        .drum::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background-color: #ddd; }

        @keyframes drumHit {
            0%, 100% { transform: rotate(60deg); }
            30% { transform: rotate(15deg); } 
        }
    </style>
</head>
<body>

    <div class="audio-notice">⚠️ 화면을 클릭하면 드럼 소리와 꼬맹이 목소리가 시작됩니다!</div>

    <!-- 자막 영역 -->
    <div class="text-container">
        <span class="char">성</span>
        <span class="char">욱</span>
        <span class="char">아</span>
        <span class="char">.</span>
        <span class="char space"></span>
        <span class="char">니</span>
        <span class="char">엄</span>
        <span class="char">마</span>
    </div>

    <!-- 못생긴 점박이 캐릭터 -->
    <div class="monster" id="monster">
        <div class="spot spot1"></div>
        <div class="spot spot2"></div>
        <div class="spot spot3"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth" id="mouth"></div>
    </div>

    <!-- 오른쪽 상단 드럼 치는 졸라맨 -->
    <div class="drummer-container">
        <div class="stickman">
            <div class="head"></div>
            <div class="body-line"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="drum"></div>
        </div>
    </div>

    <script>
        // 1. 드럼 오디오 설정
        const snareAudio = new Audio("https://freesound.org");
        let drumInterval = null;
        let mainLoopInterval = null;

        // 2. 캐릭터 TTS 목소리 및 뻐끔 설정 함수
        const mouth = document.getElementById('mouth');
        const monster = document.getElementById('monster');

        function speakCuteVoice(text) {
            if (!('speechSynthesis' in window)) return;

            // 기존 말하고 있는 음성은 즉시 정지
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            
            // 코맹맹이 귀여운 하이피치 효과 조절
            utterance.pitch = 1.8;  // 피치를 높게 설정해 아기/꼬맹이 목소리 유도 (0.0 ~ 2.0 가능)
            utterance.rate = 1.1;   // 약간 빠르게 조잘거리듯 발음
            utterance.volume = 1.0;

            // 글자 읽는 타이밍에 실시간으로 입 뻐끔거리기 연동
            utterance.onboundary = function(event) {
                if (event.name === 'word' || event.name === 'char') {
                    // 입을 열고 캐릭터 몸을 살짝 들썩이게 연출
                    mouth.style.height = '24px';
                    mouth.style.borderRadius = '30% 30% 50% 50%';
                    monster.style.transform = 'scale(1.05)';
                    
                    setTimeout(() => {
                        mouth.style.height = '6px';
                        mouth.style.borderRadius = '50%';
                        monster.style.transform = 'scale(1)';
                    }, 150);
                }
            };

            // 발화가 끝났을 때 완전히 묵념
            utterance.onend = function() {
                mouth.style.height = '6px';
                mouth.style.borderRadius = '50%';
                monster.style.transform = 'scale(1)';
            };

            window.speechSynthesis.speak(utterance);
        }

        // 전체 5초 서클에 맞춰 자막 시작과 동시에 목소리 발생 트리거
        function startMainAnimationLoop() {
            // 즉시 첫 음성 실행 후 5초 주기로 반복
            speakCuteVoice("성욱아! 니엄마");
            
            mainLoopInterval = setInterval(() => {
                speakCuteVoice("성욱아! 니엄마");
            }, 5000); // 5초 간격 자막 루프와 완전 동기화
        }

        function startDrumming() {
            if (drumInterval) return;
            drumInterval = setInterval(() => {
                snareAudio.currentTime = 0;
                snareAudio.play().catch(e => console.log("드럼 오디오 대기"));
            }, 500); // 60 BPM 루프
        }

        // 브라우저 화면 클릭 시 전체 락 해제 및 동시 재생 시작
        let isStarted = false;
        window.addEventListener('click', () => {
            if (!isStarted) {
                startDrumming();
                startMainAnimationLoop();
                
                const notice = document.querySelector('.audio-notice');
                if (notice) notice.style.display = 'none';
                isStarted = true;
            }
        });
    </script>
</body>
</html>
