<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 애니메이션</title>
    <style>
        /* 까만 배경 설정 및 화면 중앙 정렬 */
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 글자 스타일 설정 */
        .text-container {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            display: flex;
            gap: 15px; /* 글자 사이 간격 */
        }

        /* 모든 글자를 처음에는 안 보이게 설정 */
        .char {
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        /* 순서대로 나타나도록 지연 시간(Delay) 설정 */
        .char:nth-child(1) { animation-delay: 0.5s; } /* '니' */
        .char:nth-child(2) { animation-delay: 1.2s; } /* '엄' */
        .char:nth-child(3) { animation-delay: 1.9s; } /* '마' */

        /* 서서히 나타나는 애니메이션 효과 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px); /* 살짝 아래에서 위로 올라오는 효과 */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <span class="char">니</span>
        <span class="char">엄</span>
        <span class="char">마</span>
    </div>

</body>
</html>
