<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 무한 반복 애니메이션</title>
    <style>
        /* 까만 배경 및 중앙 정렬 */
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 전체 글자 컨테이너 */
        .text-container {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            display: flex;
            gap: 10px;
        }

        /* 띄어쓰기용 공백 스타일 */
        .space {
            width: 25px; 
        }

        /* 전체 애니메이션 주기: 총 5초 동안 작동 */
        .char {
            opacity: 0;
            animation: fadeInOut 5s infinite;
        }

        /* 각 글자가 나타나는 지연 시간(Delay) 설정 */
        .char:nth-child(1) { animation-delay: 0.0s; } /* 성 */
        .char:nth-child(2) { animation-delay: 0.4s; } /* 욱 */
        .char:nth-child(3) { animation-delay: 0.8s; } /* 아 */
        .char:nth-child(4) { animation-delay: 1.2s; } /* . */
        /* 5번은 공백 */
        .char:nth-child(6) { animation-delay: 1.8s; } /* 니 */
        .char:nth-child(7) { animation-delay: 2.2s; } /* 엄 */
        .char:nth-child(8) { animation-delay: 2.6s; } /* 마 */

        /* 나타났다가 잠시 유지된 후 사라지는 애니메이션 (반복용) */
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            /* 글자가 나타나는 구간 (약 0.4초 소요) */
            10% {
                opacity: 1;
                transform: translateY(0);
            }
            /* 모든 글자가 다 나타난 후 유지되는 구간 (약 70% 시점까지) */
            70% {
                opacity: 1;
                transform: translateY(0);
            }
            /* 다음 사이클을 위해 부드럽게 사라지는 구간 */
            80%, 100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <span class="char">성</span>
        <span class="char">욱</span>
        <span class="char">아</span>
        <span class="char">.</span>
        <span class="space"></span> <!-- 띄어쓰기 -->
        <span class="char">니</span>
        <span class="char">엄</span>
        <span class="char">마</span>
    </div>

</body>
</html>
