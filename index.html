<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker AI Console</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 500px;
            height: 600px;
            background-color: #1e1e1e;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px #00ff66;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #2d2d2d;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #00ff66;
            letter-spacing: 2px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 5px;
            line-height: 1.4;
            word-break: break-all;
        }
        .user-message {
            background-color: #00ff66;
            color: #121212;
            align-self: flex-end;
            font-weight: bold;
        }
        .ai-message {
            background-color: #2d2d2d;
            color: #00ff66;
            align-self: flex-start;
            border: 1px solid #00ff66;
        }
        .input-container {
            display: flex;
            border-top: 2px solid #00ff66;
        }
        input {
            flex: 1;
            background-color: #121212;
            border: none;
            color: #00ff66;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
        }
        input:focus {
            outline: none;
        }
        button {
            background-color: #00ff66;
            color: #121212;
            border: none;
            padding: 0 25px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">HACKER_AI_v1.0_CONSOLE</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">시스템 가동 완료. 무엇을 분석할까요?</div>
    </div>
    <div class="input-container">
        <input type="text" id="userInput" placeholder="명령어를 입력하세요..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. 유저 메시지 화면에 추가
        appendMessage(text, 'user-message');
        userInput.value = '';

        // 2. AI 생각 중 표시 추가
        const loadingId = appendMessage('AI 분석 중...', 'ai-message');
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // 3. 백엔드 플라스크 서버로 데이터 전송
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();

            // 4. 생각 중 지우고 진짜 AI 답변 넣기
            document.getElementById(loadingId).remove();
            appendMessage(data.reply, 'ai-message');
            
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('서버 통신 오류가 발생했습니다.', 'ai-message');
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        
        // 로딩 메시지 삭제를 위해 고유 ID 부여
        const id = 'msg-' + Date.now();
        msgDiv.id = id;
        
        chatBox.appendChild(msgDiv);
        return id;
    }
</script>

</body>
</html>
