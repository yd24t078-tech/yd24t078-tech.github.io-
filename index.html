<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자, 드럼 졸라맨 및 코맹맹이 캐릭터 애니메이션</title>
    <style>
        /* 까만 배경 및 중앙 정렬 */
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* 오디오 작동 안내 문구 */
        .audio-notice {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4d4d;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
        }

        /* 전체 글자 컨테이너 (6초 무한 반복) */
        .text-container {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            display: flex;
            gap: 10px;
        }

        .char {
            opacity: 0;
            animation: fadeInOut 6s infinite;
        }

        .char.space {
            animation: none;
            opacity: 1;
            width: 30px; 
        }

        /* 자막 글자 등장 스케줄 */
        .char:nth-child(1) { animation-delay: 0.0s; } /* 성 */
        .char:nth-child(2) { animation-delay: 0.4s; } /* 욱 */
        .char:nth-child(3) { animation-delay: 0.8s; } /* 아 */
        .char:nth-child(4) { animation-delay: 1.2s; } /* . */
        .char:nth-child(6) { animation-delay: 1.6s; } /* 니 */
        .char:nth-child(7) { animation-delay: 2.0s; } /* 엄 */
        .char:nth-child(8) { animation-delay: 2.4s; } /* 마 */
        .char:nth-child(10) { animation-delay: 3.0s; } /* 헤 */
        .char:nth-child(11) { animation-delay: 3.4s; } /* 헤 */
        .char:nth-child(12) { animation-delay: 3.8s; } /* 헤 */

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            75% { opacity: 1; transform: translateY(0); }
            85%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* [왼쪽 아래] 못생긴 점박이 캐릭터 */
        .monster {
            position: absolute;
            left: 40px;
            bottom: 40px;
            width: 120px;
            height: 120px;
            background-color: #7fa99b;
            border-radius: 50%;
            border: 4px solid #555;
            transition: transform 0.1s ease;
        }
        .eye {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .eye::after {
            content: '';
            position: absolute;
            background-color: black;
            border-radius: 50%;
            width: 6px; height: 6px;
            top: 30%; left: 30%;
        }
        .eye.left { width: 24px; height: 28px; top: 25px; left: 25px; }
        .eye.right { width: 18px; height: 20px; top: 28px; left: 65px; }
        .spot { position: absolute; background-color: #5d8276; border-radius: 50%; }
        .spot1 { width: 14px; height: 10px; top: 15px; left: 50px; }
        .spot2 { width: 10px; height: 14px; top: 70px; left: 20px; }
        .spot3 { width: 16px; height: 12px; top: 50px; right: 15px; }
        
        /* 캐릭터의 입 */
        .mouth {
            position: absolute;
            background-color: #551a1a;
            border: 3px solid #333;
            border-radius: 50%;
            left: 35px; top: 60px;
            width: 40px; height: 6px;
            transition: height 0.1s ease, border-radius 0.1s ease;
        }

        /* [오른쪽 위] 졸라맨 + 드럼 컨테이너 */
        .drummer-container {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 150px;
            height: 180px;
            z-index: 5;
        }
        .stickman { position: relative; width: 100%; height: 100%; }
        .head {
            position: absolute;
            width: 30px; height: 30px;
            border: 3px solid white;
            border-radius: 50%;
            left: 60px; top: 20px;
            box-sizing: border-box;
        }
        .body-line { position: absolute; width: 3px; height: 50px; background-color: white; left: 74px; top: 50px; }
        .leg { position: absolute; width: 3px; height: 40px; background-color: white; top: 97px; }
        .leg.left { left: 68px; transform: rotate(15deg); }
        .leg.right { left: 80px; transform: rotate(-15deg); }

        /* 팔 타격 애니메이션 (1초 주기 = 60 BPM) */
        .arm {
            position: absolute;
            width: 3px; height: 35px;
            background-color: white;
            top: 55px;
            transform-origin: top center;
            animation: drumHit 1s infinite ease-in-out;
        }
        .arm.left { left: 74px; transform: rotate(45deg); }
        .arm.right { left: 74px; transform: rotate(-45deg); animation-delay: 0.5s; }

        .drum {
            position: absolute;
            width: 60px; height: 35px;
            background-color: #333;
            border: 3px solid white;
            border-radius: 4px;
            left: 45px; top: 85px;
            box-sizing: border-box;
        }
        .drum::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background-color: #ddd; }

        @keyframes drumHit {
            0%, 100% { transform: rotate(60deg); }
            30% { transform: rotate(15deg); } 
        }
    </style>
</head>
<body>

    <div class="audio-notice">⚠️ 화면을 클릭하면 드럼 비트와 "엉우가이어엄므아" 목소리가 나옵니다!</div>

    <!-- 자막 영역 -->
    <div class="text-container">
        <span class="char">성</span>
        <span class="char">욱</span>
        <span class="char">아</span>
        <span class="char">.</span>
        <span class="char space"></span>
        <span class="char">니</span>
        <span class="char">엄</span>
        <span class="char">마</span>
        <span class="char space"></span>
        <span class="char">헤</span>
        <span class="char">헤</span>
        <span class="char">헤</span>
    </div>

    <!-- 못생긴 점박이 캐릭터 -->
    <div class="monster" id="monster">
        <div class="spot spot1"></div>
        <div class="spot spot2"></div>
        <div class="spot spot3"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth" id="mouth"></div>
    </div>

    <!-- 오른쪽 상단 드럼 치는 졸라맨 -->
    <div class="drummer-container">
        <div class="stickman">
            <div class="head"></div>
            <div class="body-line"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="drum"></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let drumInterval = null;
        let mainLoopInterval = null;

        const mouth = document.getElementById('mouth');
        const monster = document.getElementById('monster');

        // [중요 변경] 오류 가능성을 완벽히 제거한 초간단 비프음 합성 드럼 타격 효과
        function playSnareBeep() {
            if (!audioCtx) return;
            
            try {
                const now = audioCtx.currentTime;

                // 1. 드럼통 울림 (낮은 둥 소리)
                const oscLow = audioCtx.createOscillator();
                const gainLow = audioCtx.createGain();
                oscLow.type = 'triangle';
                oscLow.frequency.setValueAtTime(150, now);
                oscLow.frequency.exponentialRampToValueAtTime(80, now + 0.05);
                gainLow.gain.setValueAtTime(0.4, now);
                gainLow.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                
                oscLow.connect(gainLow);
                gainLow.connect(audioCtx.destination);

                // 2. 챙! 하는 스네어 쇳소리 (매우 높은 노이즈성 비프음)
                const oscHigh = audioCtx.createOscillator();
                const gainHigh = audioCtx.createGain();
                oscHigh.type = 'sawtooth'; // 째지는 소리 유도
                oscHigh.frequency.setValueAtTime(800, now); // 고주파
                gainHigh.gain.setValueAtTime(0.2, now);
                gainHigh.gain.exponentialRampToValueAtTime(0.01, now + 0.07);

                oscHigh.connect(gainHigh);
                gainHigh.connect(audioCtx.destination);

                // 동시 재생 및 정지
                oscLow.start(now);
                oscHigh.start(now);
                oscLow.stop(now + 0.08);
                oscHigh.stop(now + 0.08);
            } catch (e) {
                console.log("드럼 오디오 처리 에러 보정");
            }
        }

        // 코맹맹이 유도형 튜닝 발음 적용 함수
        function speakCuteVoice() {
            if (!('speechSynthesis' in window)) return;
            
            try {
                window.speechSynthesis.cancel(); 

                const utterance = new SpeechSynthesisUtterance("엉우가아.. 이 어엄 므아아.. 헤헤헤");
                utterance.lang = 'ko-KR';
                utterance.pitch = 2.0;  // 최고 하이 피치
                utterance.rate = 1.0;   
                utterance.volume = 1.0;

                // 음절 타이밍에 입 뻐끔
                utterance.onboundary = function(event) {
                    if (event.name === 'word' || event.name === 'char') {
                        mouth.style.height = '26px';
                        mouth.style.borderRadius = '30% 30% 50% 50%';
                        monster.style.transform = 'scale(1.08)';
                        
                        setTimeout(() => {
                            mouth.style.height = '6px';
                            mouth.style.borderRadius = '50%';
                            monster.style.transform = 'scale(1)';
                        }, 140);
