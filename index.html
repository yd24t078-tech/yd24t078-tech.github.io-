<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 및 캐릭터 애니메이션</title>
    <style>
        /* 까만 배경 및 중앙 정렬 */
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* 전체 글자 컨테이너 */
        .text-container {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            display: flex;
            gap: 10px;
        }

        /* 전체 애니메이션 주기: 총 5초 동안 작동 */
        .char {
            opacity: 0;
            animation: fadeInOut 5s infinite;
        }

        /* 띄어쓰기 글자는 애니메이션 효과 없이 공간만 차지 */
        .char.space {
            animation: none;
            opacity: 1;
            width: 30px; 
        }

        /* 각 글자가 나타나는 지연 시간(Delay) 설정 */
        .char:nth-child(1) { animation-delay: 0.0s; } /* 성 */
        .char:nth-child(2) { animation-delay: 0.4s; } /* 욱 */
        .char:nth-child(3) { animation-delay: 0.8s; } /* 아 */
        .char:nth-child(4) { animation-delay: 1.2s; } /* . */
        /* 5번은 띄어쓰기 공간 */
        .char:nth-child(6) { animation-delay: 1.6s; } /* 니 */
        .char:nth-child(7) { animation-delay: 2.0s; } /* 엄 */
        .char:nth-child(8) { animation-delay: 2.4s; } /* 마 */

        /* 글자 자막 애니메이션 */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            80%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* [캐릭터 관련 스타일] 왼쪽 아래 구석에 배치 */
        .monster {
            position: absolute;
            left: 40px;
            bottom: 40px;
            width: 120px;
            height: 120px;
            background-color: #7fa99b; /* 못생긴 올리브 그린색 몸통 */
            border-radius: 50%; /* 동그란 몸 */
            border: 4px solid #555;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.1);
        }

        /* 못생긴 비대칭 눈 */
        .eye {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .eye::after {
            content: '';
            position: absolute;
            background-color: black;
            border-radius: 50%;
            width: 6px;
            height: 6px;
            top: 30%;
            left: 30%;
        }
        .eye.left {
            width: 24px;
            height: 28px;
            top: 25px;
            left: 25px;
        }
        .eye.right {
            width: 18px;
            height: 20px;
            top: 28px;
            left: 65px; /* 짝눈 효과 */
        }

        /* 점박이 무늬들 */
        .spot {
            position: absolute;
            background-color: #5d8276;
            border-radius: 50%;
        }
        .spot1 { width: 14px; height: 10px; top: 15px; left: 50px; }
        .spot2 { width: 10px; height: 14px; top: 70px; left: 20px; }
        .spot3 { width: 16px; height: 12px; top: 50px; right: 15px; }

        /* 글자 타이밍에 맞춰 움직이는 입 */
        .mouth {
            position: absolute;
            background-color: #551a1a;
            border: 3px solid #333;
            border-radius: 50%;
            left: 35px;
            top: 60px;
            width: 40px;
            height: 10px; /* 기본은 닫힌 상태 */
            animation: talk 5s infinite;
        }

        /* 글자가 하나씩 나올 때마다(0.0초 ~ 2.8초 사이) 입을 열고 닫음 */
        @keyframes talk {
            0%, 7.9%, 15.9%, 23.9%, 31.9%, 39.9%, 47.9%, 56% { height: 6px; border-radius: 50%; } /* 다물기 */
            4%, 12%, 20%, 28%, 36%, 44%, 52% { height: 25px; border-radius: 30% 30% 50% 50%; } /* 벌리기 */
            60%, 100% { height: 6px; border-radius: 50%; } /* 자막 멈춘 동안은 다물기 */
        }
    </style>
</head>
<body>

    <!-- 자막 영역 -->
    <div class="text-container">
        <span class="char">성</span>
        <span class="char">욱</span>
        <span class="char">아</span>
        <span class="char">.</span>
        <span class="char space"></span>
        <span class="char">니</span>
        <span class="char">엄</span>
        <span class="char">마</span>
    </div>

    <!-- 못생긴 점박이 캐릭터 영역 -->
    <div class="monster">
        <div class="spot spot1"></div>
        <div class="spot spot2"></div>
        <div class="spot spot3"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>

</body>
</html>
